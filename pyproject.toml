[project]
name = "simple-serving"
version = "0.1.0"
description = "A gateway in front of vLLM that serves one text model under contract v1."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "starlette",
    "uvicorn",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
